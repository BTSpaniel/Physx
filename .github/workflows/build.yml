name: Build PhysX PE
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: physx-pe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned build tools
        run: python tools/bootstrap.py --install
      - name: Install development-only browser driver
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Build, simulate and test the extracted runtime archive
        shell: bash
        run: |
          set -eo pipefail
          source work/env.sh
          set -u
          python release.py all
      - name: Preserve verified release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: physx-pe-alpha-${{ github.sha }}
          path: |
            dist/physx-pe-*.zip
            dist/physx-pe-*.zip.sha256
            dist/release-artifacts.json
          if-no-files-found: error
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: physx-pe-diagnostics-${{ github.sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physx-pe-alpha-${{ github.sha }}
          path: release-payload
      - name: Publish verified private prerelease
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/publish_release.py release-payload --tag "$GITHUB_REF_NAME"
