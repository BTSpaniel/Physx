name: Build PhysX PE
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: physx-pe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned build tools
        run: python tools/bootstrap.py --install
      - name: Install development-only browser driver
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium firefox
      - name: Install and select Mesa software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends mesa-vulkan-drivers vulkan-tools
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          candidates = sorted(Path('/usr/share/vulkan/icd.d').glob('lvp_icd*.json'))
          if len(candidates) != 1 or not candidates[0].is_file() or candidates[0].is_symlink():
              raise RuntimeError('Expected one ordinary installed Mesa lavapipe ICD descriptor')
          icd = candidates[0].resolve()
          if not icd.is_relative_to(Path('/usr/share/vulkan/icd.d').resolve()):
              raise RuntimeError('Mesa ICD descriptor escapes its system directory')
          data = icd.read_bytes()
          descriptor = json.loads(data)
          version = subprocess.check_output(['dpkg-query', '-W', '-f=${Version}', 'mesa-vulkan-drivers'], text=True).strip()
          reports = Path('reports')
          reports.mkdir(exist_ok=True)
          (reports / 'software-vulkan-driver.json').write_text(json.dumps({
              'schema': 'physx-pe.software-vulkan-install/v1', 'status': 'INSTALLED_NOT_GPU_VERIFIED',
              'mesaPackageVersion': version, 'icdPath': str(icd),
              'icdSha256': hashlib.sha256(data).hexdigest(), 'descriptor': descriptor,
              'scope': 'Installed driver identity only; GPU capability and graph execution remain separate checks',
          }, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as environment:
              environment.write('VK_ICD_FILENAMES=' + str(icd) + '\n')
              environment.write('VK_DRIVER_FILES=' + str(icd) + '\n')
          driver_environment = dict(os.environ, VK_ICD_FILENAMES=str(icd), VK_DRIVER_FILES=str(icd))
          diagnostics = []
          for arguments in (['vulkaninfo', '--summary'], ['vulkaninfo']):
              result = subprocess.run(arguments, env=driver_environment, text=True,
                                      stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=60)
              diagnostics.append({'command': arguments, 'exitCode': result.returncode,
                                  'stdout': result.stdout, 'stderr': result.stderr})
          (reports / 'software-vulkan-diagnostics.json').write_text(json.dumps({
              'scope': 'Actual selected-driver diagnostics; not browser or Flow execution proof',
              'commands': diagnostics,
          }, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Execute Flow's required 1024-thread WebGPU capability probe
        run: python tools/flow_gpu_probe.py --software-vulkan --browser-engine firefox --report reports/flow-host-capability.json
      - name: Build, simulate and test the extracted runtime archive
        shell: bash
        run: |
          set -eo pipefail
          source work/env.sh
          set -u
          python release.py all --software-vulkan --flow-browser-engine firefox
      - name: Preserve verified release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: physx-pe-alpha-${{ github.sha }}
          path: |
            dist/physx-pe-*.zip
            dist/physx-pe-*.zip.sha256
            dist/release-artifacts.json
          if-no-files-found: error
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: physx-pe-diagnostics-${{ github.sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: physx-pe-alpha-${{ github.sha }}
          path: release-payload
      - name: Publish verified private prerelease
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/publish_release.py release-payload --tag "$GITHUB_REF_NAME"
